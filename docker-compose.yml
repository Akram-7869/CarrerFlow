services:
  postgres:
    image: postgres:17-alpine
    container_name: careerflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-careerflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-careerflow_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-careerflow}
    ports:
      - "5432:5432"
    volumes:
      - careerflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-careerflow} -d ${POSTGRES_DB:-careerflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  careerflow-postgres-data:

